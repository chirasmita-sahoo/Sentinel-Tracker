<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Contacts - Sentinel GPS</title>
 <link rel="stylesheet" href="contacts.css">
    
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <button class="back-btn" onclick="goBack()">
                <span>←</span> Back
            </button>
            <h1>Emergency Contacts</h1>
            <button class="add-btn" onclick="openAddModal()" id="add-contact-btn">
                <span>+</span> Add Contact
            </button>
        </header>
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-value" id="total-contacts">0</span>
                <span class="stat-label">Contacts</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="contacts-limit">10</span>
                <span class="stat-label">Max Limit</span>
            </div>
        </div>

        <div id="loading-indicator" class="loading-indicator hidden">
            <div class="spinner"></div>
            <p>Loading contacts...</p>
        </div>

        <div id="contacts-list" class="contacts-list">
        </div>

        <div id="empty-state" class="empty-state hidden">
            <div class="empty-icon"></div>
            <h2>No Emergency Contacts</h2>
            <p>Add trusted contacts who will be notified in case of emergency.</p>
            <button class="primary-btn" onclick="openAddModal()">Add Your First Contact</button>
        </div>
    </div>

    <div id="contact-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Emergency Contact</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            
            <form id="contact-form" onsubmit="return false;">
                <div class="form-group">
                    <label for="contact-name">Full Name *</label>
                    <input 
                        type="text" 
                        id="contact-name" 
                        name="name"
                        placeholder="Name"
                        required
                        minlength="2"
                        maxlength="100"
                        autocomplete="name"
                    >
                    <span class="error-msg" id="name-error"></span>
                </div>

                <div class="form-group">
                    <label for="contact-email">Email Address *</label>
                    <input 
                        type="email" 
                        id="contact-email" 
                        name="email"
                        placeholder="name@example.com"
                        required
                        maxlength="255"
                        autocomplete="email"
                    >
                    <span class="error-msg" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="contact-phone">Phone Number </label>
                    <input 
                        type="tel" 
                        id="contact-phone" 
                        name="phone"
                        placeholder="+91 xyz"
                        minlength="10"
                        maxlength="20"
                        autocomplete="tel"
                    >
                    <span class="error-msg" id="phone-error"></span>
                    <small class="hint">Include country code (e.g., +1 for US)</small>
                </div>

                <div class="form-group">
                    <label for="contact-relationship">Relationship (Optional)</label>
                    <select id="contact-relationship" name="relationship">
                        <option value="">Select relationship</option>
                        <option value="family">Family</option>
                        <option value="friend">Friend</option>
                        <option value="spouse">Spouse/Partner</option>
                        <option value="colleague">Colleague</option>
                        <option value="neighbor">Neighbor</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="secondary-btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="primary-btn" id="save-btn">
                        <span id="save-btn-text">Save Contact</span>
                        <span id="save-btn-spinner" class="btn-spinner hidden"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal hidden">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Delete Contact?</h2>
                <button class="close-btn" onclick="closeDeleteModal()">×</button>
            </div>
            
            <div class="modal-body">
                <p>Are you sure you want to delete <strong id="delete-contact-name"></strong>?</p>
                <p class="warning-text">This action cannot be undone.</p>
            </div>

            <div class="modal-actions">
                <button type="button" class="secondary-btn" onclick="closeDeleteModal()">Cancel</button>
                <button type="button" class="danger-btn" onclick="confirmDelete()">
                    <span id="delete-btn-text">Delete</span>
                    <span id="delete-btn-spinner" class="btn-spinner hidden"></span>
                </button>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <!-- App Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/config.js"></script>
    <script src="js/database.js"></script>
    <script src="js/contacts.js"></script>
</body>
</html>
