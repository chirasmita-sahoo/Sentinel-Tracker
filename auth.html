<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel GPS - Login</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="hero-wrapper">
        <div id="map"></div>
         
        <div class="text-section-auth">
            

            <div id="login-form" class="auth-form ">
                <h2 >Welcome Back</h2>  
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="your@email.com" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="password" required>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password" onclick="showForgotPassword(); return false;">
                        Forgot password?
                    </a>
                </div>

                <button class="auth-btn primary-btn" onclick="handleLogin()" >
                    <span id="login-btn-text">Sign In</span>
                    <span id="login-spinner" class="spinner hidden"></span>
                </button>

                <div class="auth-divider" style="text-align: center; margin: 15px 0; color: #666;">
                    <span>Don't have an account?</span>
                </div>
                <button class="auth-btn secondary-btn" onclick="showSignupForm()" style="width: 100%;">
                    Create Account
                </button>

                <div id="login-error" class="error-message hidden"></div>
            </div>

            <div id="signup-form" class="auth-form hidden">
                <h2 >Create Account</h2>                
                <div class="input-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="Your Name" required>
                </div>
                <div class="input-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="your@email.com" required>
                </div>

                <div class="input-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="••••••••" required>
                    <div class="password-strength">
                        <div id="strength-bar" class="strength-bar"></div>
                    </div>
                    <small class="password-hint">Minimum 6 characters</small>
                </div>

                <div class="input-group">
                    <label for="signup-confirm">Confirm Password</label>
                    <input type="password" id="signup-confirm" placeholder="••••••••" required>
                </div>

                <div class="terms-accept" style="margin: 15px 0;">
                    <label>
                        <input type="checkbox" id="accept-terms" required>
                        <span style="font-size: 0.9rem;">I agree to the <a href="#" onclick="return false;">Terms</a> and <a href="#" onclick="return false;">Privacy</a></span>
                    </label>
                </div>

                <button class="auth-btn primary-btn" onclick="handleSignup()">
                    <span id="signup-btn-text">Create Account</span>
                    <span id="signup-spinner" class="spinner hidden"></span>
                </button>

                <div class="auth-divider">
                    <span>Already have an account?</span>
                </div>

                <button class="auth-btn secondary-btn" onclick="showLoginForm()">
                    Sign In
                </button>

                <div id="signup-error" class="error-message hidden"></div>
            </div>

            <div id="forgot-form" class="auth-form hidden">
                <h2 style="margin-bottom: 1rem; color: #1A1D23;">Reset Password</h2>
                <p class="form-description" style="margin-bottom: 1.5rem; color: #666;">Enter your email and we'll send you a reset link.</p>
                
                <div class="input-group">
                    <label for="forgot-email">Email</label>
                    <input type="email" id="forgot-email" placeholder="your@email.com" required>
                </div>

                <button class="auth-btn primary-btn" onclick="handleForgotPassword()" style="width: 100%; margin: 15px 0;">
                    <span id="forgot-btn-text">Send Reset Link</span>
                    <span id="forgot-spinner" class="spinner hidden"></span>
                </button>

                <button class="auth-btn secondary-btn" onclick="showLoginForm()" style="width: 100%;">
                    Back to Login
                </button>

                <div id="forgot-error" class="error-message hidden"></div>
                <div id="forgot-success" class="success-message hidden"></div>
            </div>

        </div>  

        <div class="gradient-bridge-dark"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="index.js"></script> 
    <script src="js/auth.js"></script>
</body>
</html>
